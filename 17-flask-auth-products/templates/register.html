{% extends 'base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
  <div class="card auth-card p-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Crear cuenta</h2>
      <p class="text-muted m-0">Únete para administrar tus productos</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Tu nombre" required />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" required />
      </div>

      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required />
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">Registrarme</button>
    </form>

    <div class="text-center">
      <span class="text-muted">¿Ya tienes cuenta?</span>
      <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Inicia sesión</a>
    </div>
  </div>
{% endblock %}
