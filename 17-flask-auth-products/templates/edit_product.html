{% extends 'base.html' %}

{% block title %}Editar producto{% endblock %}

{% block content %}
  <div class="card dashboard-card p-4 mx-auto" style="max-width: 700px;">
    <h3 class="mb-4">Editar producto</h3>

    <form method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ product.name if product is mapping else product['name'] }}" required />
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" name="description" rows="4">{{ (product.description if product is mapping else product.get('description', '')) or '' }}</textarea>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label for="price" class="form-label">Precio</label>
          <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" value="{{ product.price if product is mapping else product['price'] }}" required />
        </div>
        <div class="col-md-6">
          <label for="stock" class="form-label">Stock</label>
          <input type="number" min="0" class="form-control" id="stock" name="stock" value="{{ product.stock if product is mapping else product['stock'] }}" required />
        </div>
      </div>

      <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
