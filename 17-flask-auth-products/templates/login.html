{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
  <div class="card auth-card p-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Iniciar sesión</h2>
      <p class="text-muted m-0">Accede a tu panel de productos</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
    </form>

    <div class="text-center">
      <span class="text-muted">¿No tienes cuenta?</span>
      <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">Regístrate</a>
    </div>
  </div>
{% endblock %}
