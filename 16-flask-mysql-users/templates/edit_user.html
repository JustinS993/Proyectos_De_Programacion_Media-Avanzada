{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <h2>Edit user</h2>

    {% if user %}
      <form action="{{ url_for('edit_user', user_id=user.id) }}" method="post" class="user-form">
        <div class="field-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" value="{{ user.name }}" required />
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="{{ user.email }}" required />
        </div>

        <div class="field-group">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="1" max="120" value="{{ user.age }}" required />
        </div>

        <div class="button-row">
          <button type="submit" class="primary-btn">Update user</button>
          <a class="secondary-btn" href="{{ url_for('users') }}">Cancel</a>
        </div>
      </form>
    {% else %}
      <p class="empty-state">User not found.</p>
      <a class="secondary-btn" href="{{ url_for('users') }}">Back to users</a>
    {% endif %}
  </section>
{% endblock %}
