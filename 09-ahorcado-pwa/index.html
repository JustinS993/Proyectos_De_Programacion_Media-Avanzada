<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado - Juego PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .container {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .score-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-box {
            background: rgba(102, 126, 234, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }

        .score-box span:first-child {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .score-box span:last-child {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        select {
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            background: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }

        select:hover, select:focus {
            border-color: #764ba2;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .game-area {
                grid-template-columns: 1fr;
            }
        }

        .hangman-canvas {
            background: #0f172a;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .word-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category {
            text-align: center;
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .category strong {
            color: #764ba2;
        }

        .word-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 40px;
            height: 50px;
            border-bottom: 4px solid #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .letter-box.correct {
            color: #22c55e;
            animation: correctPop 0.5s ease-out;
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .wrong-letters {
            text-align: center;
        }

        .wrong-letters h3 {
            color: #ef4444;
            margin-bottom: 10px;
        }

        .wrong-letters-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .wrong-letter {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: bold;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .keyboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .key {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .key:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .key:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .key.correct {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .key.wrong {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .key.pulse {
            animation: keyPulse 0.45s ease-out;
        }

        .key.shake {
            animation: keyShake 0.45s ease-in-out;
        }

        @keyframes keyPulse {
            0% { transform: scale(1); }
            40% { transform: scale(1.15); box-shadow: 0 0 12px rgba(34, 197, 94, 0.6); }
            100% { transform: scale(1); }
        }

        @keyframes keyShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .game-message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            animation: fadeIn 0.5s ease-in;
        }

        .game-message.win {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .game-message.lose {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .records {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid rgba(102, 126, 234, 0.3);
        }

        .records h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .records-list {
            display: grid;
            gap: 10px;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            background: rgba(102, 126, 234, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);
            display: none;
            transition: all 0.3s;
            z-index: 1000;
        }

        .install-btn.show {
            display: block;
            animation: bounce 0.6s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .install-btn:hover {
            transform: scale(1.05);
        }

        .offline-badge {
            display: block;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(102, 126, 234, 0.15);
        }

        .offline-badge.offline {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
        }

        .no-records {
            text-align: center;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Juego del Ahorcado</h1>
        <p class="offline-badge" id="offlineBadge">En línea</p>

        <div class="header">
            <div class="score-info">
                <div class="score-box">
                    <span>Puntuación</span>
                    <span id="score">0</span>
                </div>
                <div class="score-box">
                    <span>Récord</span>
                    <span id="highScore">0</span>
                </div>
            </div>
            <select id="categorySelect">
                <option value="programacion">Programación</option>
                <option value="videojuegos">Videojuegos</option>
                <option value="animales">Animales</option>
                <option value="paises">Países</option>
                <option value="deportes">Deportes</option>
            </select>
        </div>

        <div class="game-area">
            <div class="hangman-canvas">
                <canvas id="hangmanCanvas" width="250" height="300"></canvas>
            </div>
            <div class="word-area">
                <div class="category">Categoría: <strong id="categoryName">Programación</strong></div>
                <div class="word-display" id="wordDisplay"></div>
                <div class="wrong-letters">
                    <h3>Letras incorrectas:</h3>
                    <div class="wrong-letters-list" id="wrongLetters"></div>
                </div>
            </div>
        </div>

        <div id="gameMessage" class="game-message" style="display: none;"></div>
        
        <div class="keyboard" id="keyboard"></div>
        
        <button class="btn btn-primary" id="newGameBtn">Nuevo Juego</button>

        <div class="records">
            <h2>🏆 Mejores Puntuaciones</h2>
            <div class="records-list" id="recordsList"></div>
        </div>
    </div>

    <button class="install-btn" id="installBtn">📲 Instalar App</button>

    <script src="app.js" defer></script>
</body>
</html>
